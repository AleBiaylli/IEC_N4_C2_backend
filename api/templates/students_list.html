{% extends 'base.html' %}

{% block content %}
<div class="container-fluid px-0">
  <h2 class="mb-3">Gestión de Estudiantes</h2>
  <div class="row g-3">
    <!-- Formulario -->
    <div class="col-lg-3 col-md-4">
      <div class="card shadow-sm border-0">
        <div class="card-body p-3">
          <h5 id="formTitle" class="card-title fw-bold fs-6 mb-3">Agregar Estudiante</h5>
          <form id="studentForm">
            <input type="hidden" id="studentId" />
            <div class="mb-2">
              <input type="text" id="first_name" class="form-control form-control-sm" placeholder="Nombre" required />
            </div>
            <div class="mb-2">
              <input type="text" id="last_name" class="form-control form-control-sm" placeholder="Apellido" required />
            </div>
            <button type="submit" class="btn btn-success btn-sm w-100 mt-2">Guardar</button>
            <button type="button" id="btnCancel" class="btn btn-secondary btn-sm w-100 mt-2 d-none" onclick="limpiarFormulario()">Cancelar Edición</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Tabla -->
    <div class="col-lg-9 col-md-8">
      <div class="card shadow-sm border-0">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-sm table-striped table-hover mb-0 align-middle">
              <thead class="table-dark">
                <tr>
                  <th>ID</th>
                  <th>Nombre</th>
                  <th>Apellido</th>
                  <th class="text-center">Acciones</th>
                </tr>
              </thead>
              <tbody id="studentsTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const getCookie = name => {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === name + '=') {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  };
  const csrftoken = getCookie('csrftoken');

  async function cargarEstudiantes() {
    const res = await fetch('/api/students/');
    const data = await res.json();
    const lista = Array.isArray(data) ? data : (data.results || []);
    const tbody = document.getElementById('studentsTableBody');
    tbody.innerHTML = '';

    if (lista.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">No hay estudiantes registrados.</td></tr>';
      return;
    }

    lista.forEach(s => {
      tbody.innerHTML += `
        <tr>
          <td>${s.id}</td>
          <td>${s.first_name}</td>
          <td>${s.last_name}</td>
          <td class="text-center">
            <button class="btn btn-warning btn-sm py-0 px-2" onclick="prepararEditar(${s.id}, '${s.first_name}', '${s.last_name}')">Editar</button>
            <button class="btn btn-danger btn-sm py-0 px-2" onclick="eliminarEstudiante(${s.id})">Eliminar</button>
          </td>
        </tr>`;
    });
  }

  document.getElementById('studentForm').addEventListener('submit', async e => {
    e.preventDefault();
    const id = document.getElementById('studentId').value;
    const payload = {
      first_name: document.getElementById('first_name').value,
      last_name: document.getElementById('last_name').value
    };

    const url = id ? `/api/students/${id}/` : '/api/students/';
    const method = id ? 'PUT' : 'POST';

    const res = await fetch(url, {
      method: method,
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      limpiarFormulario();
      cargarEstudiantes();
    }
  });

  function prepararEditar(id, firstName, lastName) {
    document.getElementById('studentId').value = id;
    document.getElementById('first_name').value = firstName;
    document.getElementById('last_name').value = lastName;
    document.getElementById('formTitle').innerText = 'Editar Estudiante';
    document.getElementById('btnCancel').classList.remove('d-none');
  }

  function limpiarFormulario() {
    document.getElementById('studentId').value = '';
    document.getElementById('studentForm').reset();
    document.getElementById('formTitle').innerText = 'Agregar Estudiante';
    document.getElementById('btnCancel').classList.add('d-none');
  }

  async function eliminarEstudiante(id) {
    if (confirm('¿Eliminar este estudiante?')) {
      const res = await fetch(`/api/students/${id}/`, {
        method: 'DELETE',
        headers: { 'X-CSRFToken': csrftoken }
      });
      if (res.ok) cargarEstudiantes();
    }
  }

  cargarEstudiantes();
</script>
{% endblock %}
