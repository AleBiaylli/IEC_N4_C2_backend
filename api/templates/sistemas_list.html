{% extends 'base.html' %}

{% block content %}
<div class="container-fluid px-0">
  <h2 class="mb-3">Gestión de Sistemas Operativos</h2>
  <div class="row g-3">
    <!-- Formulario (3 columnas) -->
    <div class="col-lg-3 col-md-4">
      <div class="card shadow-sm border-0">
        <div class="card-body p-3">
          <h5 id="formTitle" class="card-title fw-bold fs-6 mb-3">Agregar Sistema</h5>
          <form id="sistemaForm">
            <input type="hidden" id="sistemaId" />
            
            <div class="mb-2">
              <input type="text" id="nombre_sistema" class="form-control form-control-sm" placeholder="Nombre (ej: Windows, Linux)" required />
            </div>
            <div class="mb-2">
              <input type="text" id="version" class="form-control form-control-sm" placeholder="Versión (ej: Pro, Server, 22.04)" required />
            </div>

            <button type="submit" class="btn btn-success btn-sm w-100 mt-2">Guardar</button>
            <button type="button" id="btnCancel" class="btn btn-secondary btn-sm w-100 mt-2 d-none" onclick="limpiarFormulario()">Cancelar Edición</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Tabla (9 columnas) -->
    <div class="col-lg-9 col-md-8">
      <div class="card shadow-sm border-0">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-sm table-striped table-hover mb-0 align-middle" style="font-size: 0.9rem;">
              <thead class="table-dark text-nowrap">
                <tr>
                  <th>ID</th>
                  <th>Nombre del Sistema</th>
                  <th>Versión / Edición</th>
                  <th class="text-center">Acciones</th>
                </tr>
              </thead>
              <tbody id="sistemasTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const getCookie = name => {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === name + '=') {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  };

  const csrftoken = getCookie('csrftoken');

  async function cargarSistemas() {
    try {
      const res = await fetch('/api/sistemas/');
      if (!res.ok) throw new Error('Error al obtener datos');
      
      const data = await res.json();
      const lista = Array.isArray(data) ? data : (data.results || []);

      const tbody = document.getElementById('sistemasTableBody');
      tbody.innerHTML = '';

      if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">No hay sistemas registrados.</td></tr>';
        return;
      }

      lista.forEach(s => {
        tbody.innerHTML += `
          <tr>
              <td>${s.id}</td>
              <td class="fw-semibold">${s.nombre_sistema || ''}</td>
              <td>${s.version || ''}</td>
              <td class="text-center text-nowrap">
                  <button class="btn btn-warning btn-sm py-0 px-2" onclick="prepararEditar(${s.id}, '${s.nombre_sistema}', '${s.version}')">Editar</button>
                  <button class="btn btn-danger btn-sm py-0 px-2" onclick="eliminarSistema(${s.id})">Eliminar</button>
              </td>
          </tr>`;
      });
    } catch (error) {
      console.error(error);
    }
  }

  document.getElementById('sistemaForm').addEventListener('submit', async e => {
    e.preventDefault();
    const id = document.getElementById('sistemaId').value;
    
    const payload = {
      nombre_sistema: document.getElementById('nombre_sistema').value,
      version: document.getElementById('version').value
    };

    let url = '/api/sistemas/';
    let method = 'POST';

    if (id) {
      url = `/api/sistemas/${id}/`;
      method = 'PUT';
    }

    const res = await fetch(url, {
      method: method,
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': csrftoken,
      },
      body: JSON.stringify(payload),
    });

    if (res.ok) {
      limpiarFormulario();
      cargarSistemas();
    } else {
      alert('Error al guardar el sistema.');
    }
  });

  function prepararEditar(id, nombre, version) {
    document.getElementById('sistemaId').value = id;
    document.getElementById('nombre_sistema').value = nombre;
    document.getElementById('version').value = version;

    document.getElementById('formTitle').innerText = 'Editar Sistema';
    document.getElementById('btnCancel').classList.remove('d-none');
  }

  function limpiarFormulario() {
    document.getElementById('sistemaId').value = '';
    document.getElementById('sistemaForm').reset();
    document.getElementById('formTitle').innerText = 'Agregar Sistema';
    document.getElementById('btnCancel').classList.add('d-none');
  }

  async function eliminarSistema(id) {
    if (confirm('¿Desea eliminar este sistema?')) {
      const res = await fetch(`/api/sistemas/${id}/`, {
        method: 'DELETE',
        headers: { 'X-CSRFToken': csrftoken },
      });
      if (res.ok) cargarSistemas();
    }
  }

  cargarSistemas();
</script>
{% endblock %}
