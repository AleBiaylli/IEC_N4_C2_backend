{% extends 'base.html' %}

{% block content %}
<div class="container-fluid px-0">
  <h2 class="mb-3">Gestión de Programadores</h2>
  <div class="row g-3">
    <!-- Formulario (3 columnas) -->
    <div class="col-lg-3 col-md-4">
      <div class="card shadow-sm border-0">
        <div class="card-body p-3">
          <h5 id="formTitle" class="card-title fw-bold fs-6 mb-3">Agregar Programador</h5>
          <form id="programmerForm">
            <input type="hidden" id="programmerId" />
            
            <div class="mb-2">
              <input type="text" id="nombre" class="form-control form-control-sm" placeholder="Nombre completo" required />
            </div>
            <div class="mb-2">
              <input type="text" id="rut" class="form-control form-control-sm" placeholder="RUT / DNI" required />
            </div>
            <div class="mb-2">
              <input type="tel" id="telefono" class="form-control form-control-sm" placeholder="Teléfono" required />
            </div>
            <div class="mb-2">
              <input type="email" id="correo" class="form-control form-control-sm" placeholder="Correo electrónico" required />
            </div>

            <button type="submit" class="btn btn-success btn-sm w-100 mt-2">Guardar</button>
            <button type="button" id="btnCancel" class="btn btn-secondary btn-sm w-100 mt-2 d-none" onclick="limpiarFormulario()">Cancelar Edición</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Tabla (9 columnas) -->
    <div class="col-lg-9 col-md-8">
      <div class="card shadow-sm border-0">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-sm table-striped table-hover mb-0 align-middle" style="font-size: 0.9rem;">
              <thead class="table-dark text-nowrap">
                <tr>
                  <th>Nombre</th>
                  <th>RUT/DNI</th>
                  <th>Teléfono</th>
                  <th>Correo</th>
                  <th class="text-center">Acciones</th>
                </tr>
              </thead>
              <tbody id="programmersTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const getCookie = name => {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === name + '=') {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  };

  const csrftoken = getCookie('csrftoken');

  async function cargarProgramadores() {
    try {
      const res = await fetch('/api/programmers/');
      if (!res.ok) throw new Error('Error al obtener datos');
      
      const data = await res.json();
      const lista = Array.isArray(data) ? data : (data.results || []);

      const tbody = document.getElementById('programmersTableBody');
      tbody.innerHTML = '';

      if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">No hay programadores registrados.</td></tr>';
        return;
      }

      lista.forEach(p => {
        tbody.innerHTML += `
          <tr>
              <td class="fw-semibold">${p.Nombre || ''}</td>
              <td class="text-nowrap">${p.rut || ''}</td>
              <td class="text-nowrap">${p.telefono || ''}</td>
              <td>${p.correo || ''}</td>
              <td class="text-center text-nowrap">
                  <button class="btn btn-warning btn-sm py-0 px-2" onclick="prepararEditar(${p.id}, '${p.Nombre}', '${p.rut || ''}', '${p.telefono || ''}', '${p.correo || ''}')">Editar</button>
                  <button class="btn btn-danger btn-sm py-0 px-2" onclick="eliminarProgramador(${p.id})">Eliminar</button>
              </td>
          </tr>`;
      });
    } catch (error) {
      console.error(error);
    }
  }

  document.getElementById('programmerForm').addEventListener('submit', async e => {
    e.preventDefault();
    const id = document.getElementById('programmerId').value;
    
    const payload = {
      Nombre: document.getElementById('nombre').value,
      rut: document.getElementById('rut').value,
      telefono: document.getElementById('telefono').value,
      correo: document.getElementById('correo').value
    };

    let url = '/api/programmers/';
    let method = 'POST';

    if (id) {
      url = `/api/programmers/${id}/`;
      method = 'PUT';
    }

    const res = await fetch(url, {
      method: method,
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': csrftoken,
      },
      body: JSON.stringify(payload),
    });

    if (res.ok) {
      limpiarFormulario();
      cargarProgramadores();
    } else {
      alert('Error al guardar los datos.');
    }
  });

  function prepararEditar(id, nombre, rut, telefono, correo) {
    document.getElementById('programmerId').value = id;
    document.getElementById('nombre').value = nombre;
    document.getElementById('rut').value = rut;
    document.getElementById('telefono').value = telefono;
    document.getElementById('correo').value = correo;

    document.getElementById('formTitle').innerText = 'Editar Programador';
    document.getElementById('btnCancel').classList.remove('d-none');
  }

  function limpiarFormulario() {
    document.getElementById('programmerId').value = '';
    document.getElementById('programmerForm').reset();
    document.getElementById('formTitle').innerText = 'Agregar Programador';
    document.getElementById('btnCancel').classList.add('d-none');
  }

  async function eliminarProgramador(id) {
    if (confirm('¿Desea eliminar este registro?')) {
      const res = await fetch(`/api/programmers/${id}/`, {
        method: 'DELETE',
        headers: { 'X-CSRFToken': csrftoken },
      });
      if (res.ok) cargarProgramadores();
    }
  }

  cargarProgramadores();
</script>
{% endblock %}
