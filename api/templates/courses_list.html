{% extends 'base.html' %}

{% block content %}
<div class="container-fluid px-0">
  <h2 class="mb-3">Gestión de Asignaturas</h2>
  <div class="row g-3">
    <!-- Formulario -->
    <div class="col-lg-3 col-md-4">
      <div class="card shadow-sm border-0">
        <div class="card-body p-3">
          <h5 id="formTitle" class="card-title fw-bold fs-6 mb-3">Agregar Asignatura</h5>
          <form id="courseForm">
            <input type="hidden" id="courseId" />
            <div class="mb-2">
              <input type="text" id="name" class="form-control form-control-sm" placeholder="Nombre de asignatura" required />
            </div>
            <div class="mb-2">
              <select id="teacher" class="form-select form-select-sm" required>
                <option value="">Seleccione Docente...</option>
              </select>
            </div>
            <button type="submit" class="btn btn-success btn-sm w-100 mt-2">Guardar</button>
            <button type="button" id="btnCancel" class="btn btn-secondary btn-sm w-100 mt-2 d-none" onclick="limpiarFormulario()">Cancelar Edición</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Tabla -->
    <div class="col-lg-9 col-md-8">
      <div class="card shadow-sm border-0">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-sm table-striped table-hover mb-0 align-middle">
              <thead class="table-dark">
                <tr>
                  <th>ID</th>
                  <th>Asignatura</th>
                  <th>Docente</th>
                  <th class="text-center">Acciones</th>
                </tr>
              </thead>
              <tbody id="coursesTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const getCookie = name => {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === name + '=') {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  };
  const csrftoken = getCookie('csrftoken');

  async function cargarDocentesSelect() {
    const res = await fetch('/api/teachers/');
    const data = await res.json();
    const lista = Array.isArray(data) ? data : (data.results || []);
    const select = document.getElementById('teacher');
    select.innerHTML = '<option value="">Seleccione Docente...</option>';
    lista.forEach(t => {
      select.innerHTML += `<option value="${t.id}">${t.first_name} ${t.last_name}</option>`;
    });
  }

  async function cargarCursos() {
    const res = await fetch('/api/courses/');
    const data = await res.json();
    const lista = Array.isArray(data) ? data : (data.results || []);
    const tbody = document.getElementById('coursesTableBody');
    tbody.innerHTML = '';

    if (lista.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">No hay asignaturas registradas.</td></tr>';
      return;
    }

    lista.forEach(c => {
      const nombreDocente = c.teacher_detail ? `${c.teacher_detail.first_name} ${c.teacher_detail.last_name}` : c.teacher;
      tbody.innerHTML += `
        <tr>
          <td>${c.id}</td>
          <td>${c.name}</td>
          <td>${nombreDocente}</td>
          <td class="text-center">
            <button class="btn btn-warning btn-sm py-0 px-2" onclick="prepararEditar(${c.id}, '${c.name}', ${c.teacher})">Editar</button>
            <button class="btn btn-danger btn-sm py-0 px-2" onclick="eliminarCurso(${c.id})">Eliminar</button>
          </td>
        </tr>`;
    });
  }

  document.getElementById('courseForm').addEventListener('submit', async e => {
    e.preventDefault();
    const id = document.getElementById('courseId').value;
    const payload = {
      name: document.getElementById('name').value,
      teacher: document.getElementById('teacher').value
    };

    const url = id ? `/api/courses/${id}/` : '/api/courses/';
    const method = id ? 'PUT' : 'POST';

    const res = await fetch(url, {
      method: method,
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      limpiarFormulario();
      cargarCursos();
    }
  });

  function prepararEditar(id, name, teacherId) {
    document.getElementById('courseId').value = id;
    document.getElementById('name').value = name;
    document.getElementById('teacher').value = teacherId;
    document.getElementById('formTitle').innerText = 'Editar Asignatura';
    document.getElementById('btnCancel').classList.remove('d-none');
  }

  function limpiarFormulario() {
    document.getElementById('courseId').value = '';
    document.getElementById('courseForm').reset();
    document.getElementById('formTitle').innerText = 'Agregar Asignatura';
    document.getElementById('btnCancel').classList.add('d-none');
  }

  async function eliminarCurso(id) {
    if (confirm('¿Eliminar esta asignatura?')) {
      const res = await fetch(`/api/courses/${id}/`, {
        method: 'DELETE',
        headers: { 'X-CSRFToken': csrftoken }
      });
      if (res.ok) cargarCursos();
    }
  }

  cargarDocentesSelect();
  cargarCursos();
</script>
{% endblock %}
